name: subscription_tracker
description: A subscription tracking app with usage monitoring and notifications
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  http: ^1.1.0
  provider: ^6.1.1
  shared_preferences: ^2.2.2
  flutter_local_notifications: ^19.5.0
  intl: ^0.18.1
  uuid: ^4.2.1
  flutter_slidable: ^3.0.1
  percent_indicator: ^4.2.3
  flutter_staggered_animations: ^1.1.1
  timezone: ^0.10.1
  crypto: ^3.0.3
  flutter_secure_storage: ^9.0.0
  url_launcher: ^6.3.0
  google_fonts: ^6.2.1
  fl_chart: ^0.68.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/ 

flutter_icons:
  android: true
  ios: true
  image_path: assets/images/app_icon.png
  remove_alpha_ios: true
  adaptive_icon_background: "#1E7C3B"
  adaptive_icon_foreground: assets/images/app_icon.png